AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time setup for deploying clang-auth from GitHub Actions without
  long-lived AWS keys (docs/operations.md §2.8). Creates two roles:

  - GitHubDeployRole: assumed by the deploy workflow through GitHub OIDC, only
    from this repo's `production` environment. It can upload build artifacts
    and create/execute change sets on the clang-auth stack, and nothing else.
  - CloudFormationExecutionRole: passed to CloudFormation, which uses it to
    change the stack's resources (Lambda, its IAM role, API Gateway, logs).
    The GitHub identity never holds those permissions itself.

  Deploy once with an admin profile:
    aws cloudformation deploy --template-file infra/github-deploy.yaml \
      --stack-name clang-auth-github-deploy --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides GitHubRepo=<owner>/<repo>

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/repo allowed to assume the deploy role.
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub Actions environment the deploy job runs in. Only jobs in it can assume the role.
  ServiceStackName:
    Type: String
    Default: clang-auth
  FunctionName:
    Type: String
    Default: clang-auth-service
    Description: Must match FunctionName in infra/template.yaml (${StackName}-service).
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" if this account already has the token.actions.githubusercontent.com
      OIDC provider (an account can only have one).

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceStackName}-cfn-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-clang-auth-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
              - Sid: FunctionRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                # SAM names it <stack>-ServiceFunctionRole-<suffix>.
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceStackName}-*
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags*
              - Sid: CustomDomainCertificate
                Effect: Allow
                Action: [acm:DescribeCertificate, acm:ListCertificates]
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}*
              - Sid: LogsDescribe
                Effect: Allow
                Action: [logs:DescribeLogGroups, logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries]
                Resource: "*"
              - Sid: Route53OnlyWhenHostedZoneIdIsSet
                Effect: Allow
                Action: [route53:ChangeResourceRecordSets, route53:GetChange, route53:ListResourceRecordSets, route53:GetHostedZone]
                Resource: ["arn:aws:route53:::hostedzone/*", "arn:aws:route53:::change/*"]
              - Sid: ReadUploadedCode
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceStackName}-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs that run in the protected environment.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy-clang-auth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ServiceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ServiceStackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ValidateTemplate
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: HandStackChangesToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN secret in the GitHub `production` environment.
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Set as the AWS_CFN_EXEC_ROLE_ARN secret in the GitHub `production` environment.
    Value: !GetAtt CloudFormationExecutionRole.Arn
