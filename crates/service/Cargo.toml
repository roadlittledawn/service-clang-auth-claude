[package]
name = "service"
description = "clang-auth HTTP service: axum router, local server and AWS Lambda entrypoint."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "clang_auth_service"

[[bin]]
name = "clang-auth-service"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
axum = { workspace = true }
bson = { workspace = true }
chrono = { workspace = true }
clang-auth-core = { path = "../core" }
dotenvy = "0.15"
lambda_http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
jsonwebtoken = { workspace = true }
p256 = { workspace = true }
mongodb = { workspace = true }
serde_yaml = "0.9"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
